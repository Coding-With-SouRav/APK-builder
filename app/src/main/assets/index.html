<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Chess</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">

    <style>
        :root {
            --tile: min(11.5vmin, 70px);
            color-scheme: light dark;
        }

        /* ================= WELCOME PAGE ================= */
        .welcome {
            position: relative;
            width: min(70vw, 490px);
            padding: 40px 30px;
            border-radius: 25px;
            background: rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(20px);
            box-shadow: 0 15px 50px rgba(10, 253, 184, 0.6), 0 5px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
            text-align: center;
            z-index: 1;
        }

        /* SVG pawn logo (replaces the old text glyph) */
        .logo-pawn {
            width: 100px;
            height: 100px;
            display: block;
            margin: -14px 0 -14px;
            filter: drop-shadow(0 0 10px rgba(0, 247, 255, 0.45));
        }

        .welcome h1 {
            font-size: 48px;
            margin: 10px 0;
        }

        /* Welcome buttons */
        .welcome-btn {
            width: 80%;
            padding: 18px 12px;
            border-radius: 15px;
            border: none;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #0a9bcf, #1ae3d8);
            color: white;
            cursor: pointer;
            transition: transform 220ms cubic-bezier(.2, .9, .2, 1), box-shadow 220ms;
            box-shadow:
                0 14px 36px rgba(10, 227, 216, 0.30),
                0 6px 16px rgba(0, 0, 0, 0.45),
                0 0 40px rgba(26, 227, 216, 0.10) inset;
            margin-top: 10px;
        }

        .welcome-btn:hover:not(:disabled) {
            transform: translateY(-4px) scale(1.03);
            box-shadow:
                0 22px 56px rgba(10, 227, 216, 0.40),
                0 10px 30px rgba(0, 0, 0, 0.52),
                0 0 80px rgba(26, 227, 216, 0.16) inset;
        }

        .welcome-btn:active:not(:disabled) {
            transform: translateY(0) scale(0.995);
            box-shadow:
                0 8px 20px rgba(10, 227, 216, 0.20),
                0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .welcome-btn:disabled {
            background: linear-gradient(135deg, #5a6268, #6c757d);
            cursor: not-allowed;
            opacity: 0.6;
            box-shadow:
                0 8px 20px rgba(90, 98, 104, 0.20),
                0 4px 10px rgba(0, 0, 0, 0.3);
        }

        /* ================= BODY ================= */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #1a1a2e, #000);
            font-family: 'Segoe UI', sans-serif;
            color: white;
            overflow: hidden;
        }

        #infoPanel {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            font-weight: 600;
            font-size: 18px;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px rgba(0, 72, 255, 0.515);
            text-align: center;
        }

        /* ================= MENU PAGE ================= */
        .menu {
            position: relative;
            width: min(70vw, 490px);
            padding: 40px 30px;
            border-radius: 25px;
            background: rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(20px);
            box-shadow: 0 15px 50px rgba(10, 253, 184, 0.6), 0 5px 20px rgba(0, 0, 0, 0.4);
            display: none;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            text-align: center;
            transition: all 0.3s ease;
            z-index: 1;
        }

        .menu:hover {
            transform: scale(1.02);
        }

        /* ================= UPDATED STYLISH DROPDOWNS ================= */
        .dropdown-container {
            width: 80%;
            position: relative;
            margin: 5px 0;
        }

        .dropdown-label {
            display: block;
            margin-bottom: 8px;
            text-align: left;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            padding-left: 5px;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .menu select {
            width: 100%;
            padding: 16px 20px;
            padding-right: 50px;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            font-size: 17px;
            background: rgba(20, 20, 40, 0.7);
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            appearance: none;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .menu select:hover {
            background: rgba(30, 30, 50, 0.8);
            border-color: #1ae3d8;
            transform: translateY(-2px);
            box-shadow:
                0 8px 25px rgba(26, 227, 216, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .menu select:focus {
            outline: none;
            border-color: #00f7ff;
            background: rgba(25, 25, 45, 0.9);
            box-shadow:
                0 10px 30px rgba(0, 247, 255, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                0 0 0 2px rgba(0, 247, 255, 0.1);
        }

        /* Custom dropdown arrow */
        .dropdown-container::after {
            content: "▼";
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #1ae3d8;
            font-size: 14px;
            pointer-events: none;
            transition: transform 0.3s ease;
        }

        .menu select:hover+.dropdown-container::after {
            color: #00f7ff;
        }

        .menu select:focus+.dropdown-container::after {
            transform: translateY(-50%) rotate(180deg);
            color: #00f7ff;
        }

        /* Dropdown options styling */
        .menu select option {
            background: rgba(20, 20, 40, 0.95);
            color: white;
            padding: 12px;
            font-size: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .menu select option:hover {
            background: linear-gradient(135deg, #0a9bcf, #1ae3d8);
        }

        .menu select option:checked {
            background: linear-gradient(135deg, #0a9bcf, #1ae3d8);
            color: white;
            font-weight: bold;
        }

        /* Stylish Button - UPDATED to add stronger box-shadow + hover/active effects */
        .menu button {
            width: 80%;
            padding: 16px 12px;
            border-radius: 15px;
            border: none;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #0a9bcf, #1ae3d8);
            color: white;
            cursor: pointer;
            transition: transform 220ms cubic-bezier(.2, .9, .2, 1), box-shadow 220ms;
            /* stronger, layered box-shadow for depth and glow */
            box-shadow:
                0 14px 36px rgba(10, 227, 216, 0.30),
                0 6px 16px rgba(0, 0, 0, 0.45),
                0 0 40px rgba(26, 227, 216, 0.10) inset;
            margin-top: 10px;
        }

        .menu button:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow:
                0 22px 56px rgba(10, 227, 216, 0.40),
                0 10px 30px rgba(0, 0, 0, 0.52),
                0 0 80px rgba(26, 227, 216, 0.16) inset;
        }

        .menu button:active {
            transform: translateY(0) scale(0.995);
            box-shadow:
                0 8px 20px rgba(10, 227, 216, 0.20),
                0 4px 10px rgba(0, 0, 0, 0.5);
        }

        /* Animated Gradient Border */
        .menu::before,
        .welcome::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 25px;
            padding: 2px;
            background: linear-gradient(45deg, #1ae3d8, #0a9bcf, #ff5e62, #f8ff00);
            background-size: 400% 400%;
            z-index: -1;
            animation: gradientBorder 5s ease infinite;
        }

        .square .piece {
            width: 80%;
            height: 80%;
            pointer-events: none;
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        .square .piece svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .square:hover .piece {
            transform: scale(1.08);
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5));
        }

        #startBtn {
            padding: 16px 40px;
            font-size: 20px;
            font-weight: 700;
            border-radius: 18px;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #1ae3d8, #0a9bcf);
            color: white;
            box-shadow: 0 10px 25px rgba(26, 227, 216, 0.6);
            transition: transform 0.08s ease, box-shadow 0.08s ease;
        }

        /* Instant press effect */
        #startBtn:active {
            transform: scale(0.94);
            box-shadow: 0 4px 12px rgba(26, 227, 216, 0.4);
        }

        @keyframes gradientBorder {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* ================= GAME PAGE ================= */
        .game {
            display: none;
            position: relative;
        }

        /* ================= BOARD ================= */
        .board {
            display: grid;
            grid-template-columns: repeat(8, var(--tile));
            grid-template-rows: repeat(8, var(--tile));
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 20px 15px 50px rgba(55, 239, 246, 0.6);
        }

        /* ---------- chess.com style board ---------- */
        :root {
            --sq-light: #ebecd0;
            --sq-dark: #739552;
            --hl-light: #f5f682;
            /* selected / last move on light squares */
            --hl-dark: #b9ca43;
            /* selected / last move on dark squares  */
            --hint: rgba(0, 0, 0, 0.14);
        }

        .square {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: calc(var(--tile)*0.6);
            cursor: pointer;
            user-select: none;
        }

        .light {
            background-color: var(--sq-light);
        }

        .dark {
            background-color: var(--sq-dark);
        }

        /* Piece sits above hint overlays */
        .square .piece {
            position: relative;
            z-index: 2;
        }

        /* Coordinates (file letters bottom row, rank numbers left column) */
        .square .coord {
            position: absolute;
            z-index: 1;
            font-size: calc(var(--tile) * 0.17);
            font-weight: 700;
            line-height: 1;
            pointer-events: none;
        }

        .square .coord.rank {
            top: 4%;
            left: 6%;
        }

        .square .coord.file {
            bottom: 4%;
            right: 6%;
        }

        .light .coord {
            color: var(--sq-dark);
        }

        .dark .coord {
            color: var(--sq-light);
        }

        /* Last move + selected piece: yellow-green tint */
        .light.last,
        .light.selected {
            background-color: var(--hl-light);
        }

        .dark.last,
        .dark.selected {
            background-color: var(--hl-dark);
        }

        /* Legal move: dot in the middle of the square */
        .square.suggest::after {
            content: "";
            position: absolute;
            z-index: 3;
            width: 32%;
            height: 32%;
            border-radius: 50%;
            background: var(--hint);
            pointer-events: none;
        }

        /* Capture: ring hugging the corners of the square */
        .square.capture::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            background: radial-gradient(closest-side, transparent 0 84%, var(--hint) 86%);
            pointer-events: none;
        }

        /* Hovering a legal destination shades the whole square */
        .square.suggest:hover,
        .square.capture:hover {
            background-image: linear-gradient(rgba(20, 85, 30, 0.3), rgba(20, 85, 30, 0.3));
        }

        /* King in check: red radial glow behind the king */
        .square.check {
            background-image: radial-gradient(ellipse at center,
                    rgb(255, 0, 0) 0%,
                    rgb(231, 0, 0) 25%,
                    rgba(169, 0, 0, 0) 89%,
                    rgba(158, 0, 0, 0) 100%);
        }

        /* ---------- Game end (chess.com style) ---------- */
        /* Defeated king: red square, king tips over, red "#" badge */
        .square.king-lost::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            background: rgba(235, 97, 80, 0.92);
            animation: fadeRed 0.6s ease-out both;
        }

        .piece.fallen {
            animation: kingFall 0.95s cubic-bezier(.3, .7, .4, 1) 0.15s both;
        }

        /* Winning king: hops, glows, gold ripple + crown badge */
        .piece.victor {
            animation: kingWin 0.9s ease-out 0.4s 3 both, kingGlow 1.4s ease-in-out 0.4s infinite alternate;
        }

        .piece.drawKing {
            animation: kingDraw 1.4s ease-in-out 0.3s infinite alternate;
        }

        .square.king-won::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 60%;
            height: 60%;
            border-radius: 50%;
            border: 3px solid rgba(255, 205, 40, 0.95);
            opacity: 0;
            z-index: 1;
            pointer-events: none;
            animation: winRipple 1.2s ease-out 0.4s 3;
        }

        .square.king-drawn::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 60%;
            height: 60%;
            border-radius: 50%;
            border: 3px solid rgba(200, 200, 200, 0.9);
            opacity: 0;
            z-index: 1;
            pointer-events: none;
            animation: drawRipple 1.5s ease-out 0.3s 3 both;
        }

        /* Corner badges */
        .badge {
            position: absolute;
            top: 3%;
            right: 3%;
            width: 40%;
            height: 40%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            color: #fff;
            font-weight: 800;
            font-size: calc(var(--tile) * 0.2);
            box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.9), 0 3px 8px rgba(0, 0, 0, 0.45);
            pointer-events: none;
            animation: badgePop 0.5s cubic-bezier(.2, 1.6, .4, 1) both;
        }

        .badge svg {
            width: 64%;
            height: 64%;
            display: block;
        }

        .badge.mate {
            background: #c0392b;
            animation-delay: 0.85s;
        }

        .badge.crown {
            background: #0f9114;
            animation-delay: 0.5s;
        }

        .badge.half {
            background: #8b8987;
            animation-delay: 0.3s;
        }

        @keyframes fadeRed {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes kingFall {
            0% {
                transform: rotate(0deg);
            }

            22% {
                transform: rotate(-16deg) translateY(-4%);
            }

            60% {
                transform: rotate(98deg) translateY(4%);
            }

            78% {
                transform: rotate(82deg) translateY(2%);
            }

            100% {
                transform: rotate(90deg) translateY(3%);
            }
        }

        @keyframes kingWin {

            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            40% {
                transform: translateY(-14%) scale(1.14);
            }

            70% {
                transform: translateY(0) scale(0.97);
            }
        }

        @keyframes kingGlow {
            from {
                filter: drop-shadow(0 0 2px rgba(255, 215, 0, 0.4));
            }

            to {
                filter: drop-shadow(0 0 9px rgba(255, 215, 0, 1));
            }
        }

        @keyframes kingDraw {
            from {
                transform: translateY(0) scale(1);
                filter: drop-shadow(0 0 2px rgba(210, 210, 210, 0.35));
            }

            to {
                transform: translateY(-5%) scale(1.05);
                filter: drop-shadow(0 0 8px rgba(220, 220, 220, 0.9));
            }
        }

        @keyframes winRipple {
            0% {
                transform: translate(-50%, -50%) scale(0.6);
                opacity: 0.95;
            }

            100% {
                transform: translate(-50%, -50%) scale(2.3);
                opacity: 0;
            }
        }

        @keyframes drawRipple {
            0% {
                transform: translate(-50%, -50%) scale(0.6);
                opacity: 0.8;
            }

            100% {
                transform: translate(-50%, -50%) scale(2.1);
                opacity: 0;
            }
        }

        @keyframes badgePop {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .piece.fallen,
            .piece.victor,
            .piece.drawKing,
            .badge,
            .square.king-lost::before,
            .square.king-won::before,
            .square.king-drawn::before {
                animation-duration: 0.01ms !important;
                animation-delay: 0s !important;
                animation-iteration-count: 1 !important;
            }
        }

        /* ================= HOME BUTTON ================= */
        .home-btn {
            position: fixed;
            top: 18px;
            right: 18px;
            width: 50px;
            height: 55px;
            border-radius: 16px;
            border: none;
            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            background: rgba(255, 255, 255, 0.15);

            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(24, 75, 126, 0.5);
            transition: all 0.25s ease;
        }

        .home-btn svg {
            width: 55%;
            height: 55%;
            display: block;
            pointer-events: none;
        }

        .home-btn:hover {
            transform: scale(1.12);
            background-color: rgba(255, 255, 255, 0.28);
        }

        .home-btn:active {
            transform: scale(0.95);
        }

        /* ================= WIN CONFETTI (realistic) ================= */
        .confetti-layer {
            position: fixed;
            inset: 0;
            z-index: 999;
            pointer-events: none;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            bottom: -6vh;
            left: var(--sx, 0);
            width: var(--w, 8px);
            height: var(--h, 12px);
            border-radius: 2px;
            background: var(--c, #fff);
            opacity: 0;
            will-change: translate, transform, rotate, scale, opacity;
            animation:
                confettiDrift var(--dur, 2.6s) linear var(--delay, 0s) forwards,
                confettiFall var(--dur, 2.6s) linear var(--delay, 0s) forwards,
                confettiTumble var(--dur, 2.6s) linear var(--delay, 0s) forwards,
                confettiFade var(--dur, 2.6s) linear var(--delay, 0s) forwards;
        }

        .confetti:nth-child(3n) {
            border-radius: 50%;
        }

        /* Horizontal travel: constant speed (real air-drift feel) */
        /* Horizontal: fly inward, reach the upper-center target by the apex, then hold */
        @keyframes confettiDrift {
    0% {
        transform: translateX(0);
        animation-timing-function: cubic-bezier(.25, .65, .35, 1);   /* gentler inward push */
    }

    40%,
    100% {
        transform: translateX(var(--tx));
    }
}

@keyframes confettiFall {
    0% {
        translate: 0 0;
        animation-timing-function: cubic-bezier(.22, .55, .40, 1);   /* long, lazy rise */
    }

    40% {
        translate: 0 var(--peak);
        animation-timing-function: cubic-bezier(.35, 0, .75, .45);   /* softer start of fall */
    }

    100% {
        translate: 0 12vh;
    }
}

        /* Tumbling + edge-on flutter */
        @keyframes confettiTumble {
            0% {
                rotate: 0deg;
                scale: 1 1;
            }

            25% {
                scale: 1 var(--flip, .40);
            }

            50% {
                scale: 1 1;
            }

            75% {
                scale: 1 var(--flip, .40);
            }

            100% {
                rotate: var(--spin);
                scale: 1 1;
            }
        }

        /* Long, gradual fade so pieces melt away instead of popping out */
        @keyframes confettiFade {
            0% {
                opacity: 0;
            }

            5% {
                opacity: 1;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        /* ================= PROMOTION PICKER ================= */
        .promotion-overlay {
            position: fixed;
            inset: 0;
            z-index: 1200;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(6px);
        }

        .promotion-box {
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
            padding: 22px 26px;
            border-radius: 20px;
            background: rgba(20, 20, 40, 0.95);
            border: 2px solid rgba(26, 227, 216, 0.55);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.65),
                0 0 45px rgba(26, 227, 216, 0.25);
            animation: promoPop 0.22s cubic-bezier(.2, 1.4, .4, 1) both;
        }

        .promotion-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.82);
        }

        .promotion-options {
            display: flex;
            gap: 12px;
        }

        .promo-btn {
            width: clamp(48px, 14vw, 72px);
            height: clamp(48px, 14vw, 72px);
            padding: 6px;
            border-radius: 14px;
            border: 2px solid rgba(255, 255, 255, 0.18);
            background: linear-gradient(180deg, #f2f3e0, #d9dbc0);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.18s ease, box-shadow 0.18s ease,
                        border-color 0.18s ease, background 0.18s ease;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.45);
        }

        .promo-btn svg {
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
        }

        .promo-btn:hover {
            transform: translateY(-4px) scale(1.06);
            border-color: #1ae3d8;
            background: linear-gradient(180deg, #ffffff, #e6e8cc);
            box-shadow: 0 12px 28px rgba(26, 227, 216, 0.45);
        }

        .promo-btn:active {
            transform: scale(0.95);
        }

        @keyframes promoPop {
            from { transform: scale(0.82); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {

    <script>

        /* ===== SHORTCUT: Ctrl+W = force checkmate ===== */
        function forceCheckmate() {
            // No board yet, or game already finished
            if (typeof board === "undefined" || !board || gameOver) return;

            gameOver = true;
            gameResult = "checkmate";   // side to move is shown as the mated side
            selected = null;
            suggestions = [];

            playSound("checkmate");
            setTimeout(launchConfetti, 350);
            updateInfoPanel();
            draw();
            saveGameState();            // finished game => "Continue" becomes disabled
        }

        document.addEventListener("keydown", (e) => {
            const combo =
                e.ctrlKey && !e.metaKey && (e.code === "KeyW" || e.key === "w" || e.key === "W");

            // Reliable fallback because browsers reserve plain Ctrl+W for "close tab"
            const fallback =
                e.ctrlKey && e.altKey && (e.code === "KeyW" || e.key === "w" || e.key === "W");

            if (!combo && !fallback) return;

            e.preventDefault();
            e.stopPropagation();
            forceCheckmate();
        }, true);   // capture phase = highest chance of getting the event

        // DOM Elements
        const boardEl = document.getElementById("board");
        const welcome = document.getElementById("welcome");
        const menu = document.getElementById("menu");
        const game = document.getElementById("game");
        const infoPanel = document.getElementById("infoPanel");
        const continueBtn = document.getElementById("continueBtn");
        const newGameBtn = document.getElementById("newGameBtn");

        // ================= SOUND ENGINE (local files from assets/sounds) =================
        const SOUND_BASE = "assets/sounds/";

        // Change these filenames if your files are named differently (.wav / .ogg / .m4a work too)
        const SOUND_FILES = {
            click: "click.wav",        // UI buttons + dropdowns
            move: "move-self.mp3",          // normal piece move
            capture: "capture.mp3",    // capture / en-passant
            castle: "castle.mp3",      // castling
            check: "move-check.mp3",        // move that gives check
            checkmate: "checkmate.mp3",// checkmate
            draw: "game-draw.mp3"           // stalemate / draw
        };

        // Per-sound volume (0 .. 1)
        const SOUND_VOLUME = {
            click: 0.45,
            move: 0.75,
            capture: 0.85,
            castle: 0.80,
            check: 0.85,
            checkmate: 1.00,
            draw: 0.80
        };

        const POOL_SIZE = 4;        // simultaneous voices per sound (so rapid moves don't cut off)
        const soundPools = {};      // name -> { list: [Audio], i: 0 }
        let soundEnabled = true;

        // Preload every sound into a small pool of <audio> elements.
        // Using <audio> instead of fetch()/decodeAudioData() means this also
        // works when index.html is opened directly from disk (file://).
        function preloadSounds() {
            Object.keys(SOUND_FILES).forEach(name => {
                const list = [];
                for (let i = 0; i < POOL_SIZE; i++) {
                    const a = new Audio();
                    a.src = SOUND_BASE + SOUND_FILES[name];
                    a.preload = "auto";
                    a.volume = (SOUND_VOLUME[name] !== undefined) ? SOUND_VOLUME[name] : 0.8;
                    a.addEventListener("error", () => {
                        if (i === 0) {
                            console.warn(`[sound] could not load: ${SOUND_BASE + SOUND_FILES[name]}`);
                        }
                    });
                    list.push(a);
                }
                soundPools[name] = { list, i: 0 };
            });
        }

        // names: move, capture, castle, check, checkmate, draw, click
        function playSound(name) {
            if (!soundEnabled) return;
            const entry = soundPools[name];
            if (!entry) return;

            const a = entry.list[entry.i];
            entry.i = (entry.i + 1) % entry.list.length;   // round-robin voices

            try {
                a.currentTime = 0;
                const p = a.play();
                if (p && typeof p.catch === "function") p.catch(() => { });
            } catch (e) {
                // audio not available - ignore
            }
        }

        preloadSounds();

        // ================= WIN CONFETTI (chess.com style) =================
        const CONFETTI_COLORS = [
            "#f5f682", "#b9ca43", "#1ae3d8", "#0a9bcf",
            "#ffcd28", "#ff5e62", "#ffffff", "#8cf504"
        ];

        function launchConfetti() {
            // Canvas version: works on every Android WebView (no CSS translate/rotate/scale
            // properties) and is NOT disabled by the phone's "remove animations"/battery-saver mode.
            const old = document.getElementById("confettiCanvas");
            if (old) old.remove();

            const canvas = document.createElement("canvas");
            canvas.id = "confettiCanvas";
            canvas.style.cssText = "position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:99999;pointer-events:none;";
            document.body.appendChild(canvas);

            const dpr = window.devicePixelRatio || 1;
            const W = window.innerWidth, H = window.innerHeight;
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            const ctx = canvas.getContext("2d");
            ctx.scale(dpr, dpr);

            const G = H * 1.1;                       // gravity (px/s^2), scales with screen
            const parts = [];
            const PER_CORNER = 55;

            [0, 1].forEach(side => {
                const sx = side === 0 ? -6 : W + 6;
                for (let i = 0; i < PER_CORNER; i++) {
                    const targetX = W * (0.5 + (Math.random() - 0.5) * 0.40 + (Math.random() - 0.5) * 0.08);
                    const peak = H * (0.40 + Math.pow(Math.random(), 0.7) * 0.40);
                    const vy = -Math.sqrt(2 * G * peak);
                    const tApex = -vy / G;
                    parts.push({
                        x: sx, y: H + H * 0.06,
                        vx: (targetX - sx) / tApex,
                        vy,
                        w: 5 + Math.random() * 6,
                        h: 7 + Math.random() * 11,
                        rot: Math.random() * 6.28,
                        vr: (Math.random() - 0.5) * 12,
                        flip: Math.random() * 6.28,
                        vf: 6 + Math.random() * 8,
                        color: CONFETTI_COLORS[(Math.random() * CONFETTI_COLORS.length) | 0],
                        round: i % 3 === 0,
                        delay: Math.random() * 0.30,
                        life: 4.2 + Math.random() * 1.8
                    });
                }
            });

            let last = performance.now(), elapsed = 0;
            function frame(now) {
                const dt = Math.min((now - last) / 1000, 0.05);
                last = now; elapsed += dt;
                ctx.clearRect(0, 0, W, H);
                let alive = 0;

                for (const p of parts) {
                    const t = elapsed - p.delay;
                    if (t < 0) { alive++; continue; }
                    if (t > p.life) continue;
                    alive++;

                    p.vy += G * dt;
                    // after the apex the air slows sideways drift and limits fall speed
                    if (p.vy > 0) {
                        p.vx *= Math.pow(0.35, dt);
                        p.vy = Math.min(p.vy, H * 0.35);
                    }
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.rot += p.vr * dt;
                    p.flip += p.vf * dt;

                    const k = t / p.life;
                    const alpha = k < 0.05 ? k / 0.05 : (k < 0.5 ? 1 : 1 - (k - 0.5) / 0.5);

                    ctx.save();
                    ctx.globalAlpha = Math.max(0, alpha);
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    ctx.scale(1, 0.3 + 0.7 * Math.abs(Math.cos(p.flip)));
                    ctx.fillStyle = p.color;
                    if (p.round) {
                        ctx.beginPath();
                        ctx.arc(0, 0, p.w / 2, 0, 6.2832);
                        ctx.fill();
                    } else {
                        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    }
                    ctx.restore();
                }

                if (alive > 0) requestAnimationFrame(frame);
                else canvas.remove();
            }
            requestAnimationFrame(frame);
        }
